name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  check-and-test:
    name: Check, Lint & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Desktop Bridge and Release Default Regressions
        run: python -B -m unittest -v test_desktop_bridge_regression test_desktop_runtime

      - name: Offline Publication and Backup Regressions
        run: python -B -m unittest discover -s deploy -p "test_publish_native*.py" -v

      - name: Offline Artifact Mapping Regressions
        run: python -B -m unittest discover -s deploy -p "test_artifact_provenance.py" -v

      - name: Backup Transport Regressions
        run: python -B -m unittest discover -s deploy/backup -p "test_*.py" -v

      - name: Deployment Script Syntax
        if: runner.os == 'Linux'
        run: |
          bash -n deploy/backup/backup.sh
          bash -n deploy/backup/restore.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --exclude desktop-host --all-targets --locked -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --exclude desktop-host --locked --no-fail-fast


  frontend:
    name: Build Admin UI & Contract Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.61.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/visual.cjs
      - run: node tests/visual-authenticated.cjs
      - run: node tests/auth-gate.cjs
      - run: npm run test:usability
      - run: npm run test:card-bulk
      - run: npm run test:iteration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.61.0
      - run: python -m playwright install chromium
      - name: Build and Test React Desktop UI
        run: |
          npm --prefix apps/desktop-ui ci
          npm --prefix apps/desktop-ui run build
          npm --prefix apps/desktop-ui test
          python -B apps/desktop-ui/verify_layout.py
          python -B apps/desktop-ui/verify_browser.py
        working-directory: .
      - name: Portal UI Layout and Interaction Regressions
        run: python -B -m unittest -v test_superkiro_portal_ui
        working-directory: .
      - name: Install Chinese Sans Font for Visual Checks
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Portal Pencil Alignment Regressions
        run: python -B apps/portal-ui/test_pencil_alignment.py -v
        working-directory: .

  security:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo deny
        run: cargo deny check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

