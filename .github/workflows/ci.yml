name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Jobs only read the repository; a compromised step gets no write token.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  check-and-test:
    name: Check, Lint & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Desktop Bridge and Release Default Regressions
        run: python -B -m unittest -v test_desktop_bridge_regression test_desktop_runtime

      # Needed by the deploy suite below, which reaches them through
      # `deploy.release_candidate` -> `test_deployed_server`. They were absent
      # because four of those test files had never been executed in CI.
      - run: python -m pip install requests==2.32.3 paramiko==3.5.1

      # Whole suite rather than named files: the release promotion, browser-auth
      # contract, admin-static and pricing/model publication checks previously
      # existed but ran nowhere, so a regression in them was invisible.
      - name: Offline Deployment Regressions
        run: python -B -m unittest discover -s deploy -p "test_*.py" -v

      - name: SSH Host-Key Verification (including optimized Python)
        run: |
          python -B -m unittest -v deploy.test_ssh_transport
          python -O -B -m unittest -v deploy.test_ssh_transport

      - name: Backup Transport Regressions
        run: python -B -m unittest discover -s deploy/backup -p "test_*.py" -v

      - name: Deployment Script Syntax
        if: runner.os == 'Linux'
        run: |
          bash -n deploy/backup/backup.sh
          bash -n deploy/backup/restore.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --workspace --exclude desktop-host --all-targets --locked -- -D warnings

      - name: Run Tests
        run: cargo test --workspace --exclude desktop-host --locked --no-fail-fast


  frontend:
    name: Build Admin UI & Contract Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm install --no-save --package-lock=false playwright@1.61.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/visual.cjs
      - run: node tests/visual-authenticated.cjs
      - run: node tests/auth-gate.cjs
      - run: npm run test:usability
      - run: npm run test:card-bulk
      - run: npm run test:iteration
      - run: npm run test:issuance
      - run: npm run test:experience
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.61.0
      - run: python -m playwright install chromium
      - name: Build and Test React Desktop UI
        run: |
          npm --prefix apps/desktop-ui ci
          npm --prefix apps/desktop-ui run build
          npm --prefix apps/desktop-ui test
          python -B apps/desktop-ui/verify_layout.py
          python -B apps/desktop-ui/verify_browser.py
        working-directory: .
      - name: Portal UI Layout and Interaction Regressions
        run: python -B -m unittest -v test_superkiro_portal_ui
        working-directory: .
      - name: Install Chinese Sans Font for Visual Checks
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Portal Pencil Alignment Regressions
        run: python -B apps/portal-ui/test_pencil_alignment.py -v
        working-directory: .

  security:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The secret scan lists a pull request's commits.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Run cargo deny
        run: cargo deny check

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo audit
        run: cargo audit

