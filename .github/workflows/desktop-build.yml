name: Desktop Native Packages
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_BUILD_JOBS: 2
  SUPERKIRO_BUILD_REVISION: ${{ github.sha }}
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm --prefix apps/desktop-ui ci
      - run: npm --prefix apps/desktop-ui run build
      - run: npm --prefix apps/desktop-ui test
      - run: cargo fmt -p desktop-host -- --check
      - run: cargo clippy --locked -p desktop-host --all-targets -- -D warnings
      - run: cargo test --locked -p desktop-host -p patch-engine
      - run: python scripts/build_desktop.py
      - name: Record source and artifact mapping (not signing or acceptance)
        run: python -B deploy/artifact_provenance.py --artifact dist/Superkiro.exe --version "ci-${{ github.run_id }}.${{ github.run_attempt }}" --platform windows --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: Superkiro-Windows-x64-unsigned
          path: |
            dist/Superkiro.exe
            dist/Superkiro.exe.provenance.json
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-macos-${{ matrix.target }}
      - run: npm --prefix apps/desktop-ui ci
      - run: npm --prefix apps/desktop-ui test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build app (no Developer ID signing or notarization)
        working-directory: crates/desktop-host
        run: npx --yes --package @tauri-apps/cli@2.8.4 tauri build --target ${{ matrix.target }} --bundles app --ci -- --locked
      - name: Archive app preserving permissions and symlinks
        shell: bash
        run: |
          test -x "target/${{ matrix.target }}/release/bundle/macos/Superkiro.app/Contents/MacOS/Superkiro"
          mkdir -p dist
          tar -czf "dist/Superkiro-macOS-${{ matrix.arch }}-unsigned.app.tar.gz" -C "target/${{ matrix.target }}/release/bundle/macos" Superkiro.app
      - name: Record source and artifact mapping (not signing or acceptance)
        run: python -B deploy/artifact_provenance.py --artifact dist/Superkiro-macOS-${{ matrix.arch }}-unsigned.app.tar.gz --version "ci-${{ github.run_id }}.${{ github.run_attempt }}" --platform macos --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Superkiro-macOS-${{ matrix.arch }}-unsigned
          path: |
            dist/Superkiro-macOS-${{ matrix.arch }}-unsigned.app.tar.gz
            dist/Superkiro-macOS-${{ matrix.arch }}-unsigned.app.tar.gz.provenance.json
          if-no-files-found: error
          retention-days: 14
