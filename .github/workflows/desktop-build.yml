name: Desktop Native Packages
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version the clients are built as (e.g. 2026.09.25); empty builds never update themselves'
        required: false
        default: ''
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_BUILD_JOBS: 2
  SUPERKIRO_BUILD_REVISION: ${{ github.sha }}
  SUPERKIRO_RELEASE_VERSION: ${{ inputs.release_version }}
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: npm --prefix apps/desktop-ui ci
      - run: npm --prefix apps/desktop-ui run build
      - run: npm --prefix apps/desktop-ui test
      - run: cargo fmt -p desktop-host -- --check
      - run: cargo clippy --locked -p desktop-host --all-targets -- -D warnings
      - run: cargo test --locked -p desktop-host -p patch-engine
      - run: python scripts/build_desktop.py --release-version "${{ inputs.release_version }}"
      - name: Record source and artifact mapping (not signing or acceptance)
        run: python -B deploy/artifact_provenance.py --artifact dist/Superkiro.exe --version "ci-${{ github.run_id }}.${{ github.run_attempt }}" --platform windows --arch x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Superkiro-Windows-x64-unsigned
          path: |
            dist/Superkiro.exe
            dist/Superkiro.exe.provenance.json
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} app
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-macos-${{ matrix.target }}
      - run: npm --prefix apps/desktop-ui ci
      # The host embeds the built UI, so its tests need it too.
      - run: npm --prefix apps/desktop-ui run build
      - run: npm --prefix apps/desktop-ui test
      # The macOS stop, gate and install paths differ from Windows and had never been
      # tested anywhere before a release.
      - name: Rust tests (engine and host)
        run: cargo test --locked --no-fail-fast -p patch-engine -p desktop-host
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # The Tauri CLI and its native binary come from the UI lockfile, integrity-checked.
      - name: Build app (no Developer ID signing or notarization)
        working-directory: crates/desktop-host
        run: ../../apps/desktop-ui/node_modules/.bin/tauri build --target ${{ matrix.target }} --bundles app --ci -- --locked
      - name: Archive app preserving permissions and symlinks
        shell: bash
        run: |
          test -x "target/${{ matrix.target }}/release/bundle/macos/Superkiro.app/Contents/MacOS/Superkiro"
          mkdir -p dist
          tar -czf "dist/Superkiro-macOS-${{ matrix.arch }}-unsigned.app.tar.gz" -C "target/${{ matrix.target }}/release/bundle/macos" Superkiro.app
      - name: Record source and artifact mapping (not signing or acceptance)
        run: python -B deploy/artifact_provenance.py --artifact dist/Superkiro-macOS-${{ matrix.arch }}-unsigned.app.tar.gz --version "ci-${{ github.run_id }}.${{ github.run_attempt }}" --platform macos --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Superkiro-macOS-${{ matrix.arch }}-unsigned
          path: |
            dist/Superkiro-macOS-${{ matrix.arch }}-unsigned.app.tar.gz
            dist/Superkiro-macOS-${{ matrix.arch }}-unsigned.app.tar.gz.provenance.json
          if-no-files-found: error
          retention-days: 14
