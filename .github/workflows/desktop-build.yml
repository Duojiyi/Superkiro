name: Desktop Packages
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install -r requirements-desktop.txt pyinstaller==6.16.0
      - run: python -m unittest -v test_desktop_bridge_regression test_desktop_runtime
      - run: cargo test --locked -p patch-engine
      - run: python scripts/build_desktop.py
      - name: Archive macOS bundle preserving permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Superkiro.app dist/Superkiro-${{ runner.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Superkiro-${{ runner.os }}-${{ runner.arch }}-unsigned
          path: |
            dist/Superkiro-*.zip
            dist/Superkiro/**
          if-no-files-found: error
          retention-days: 14
