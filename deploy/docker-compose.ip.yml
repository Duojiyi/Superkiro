services:
  gateway:
    image: kiro-byok:local
    container_name: kiro-gateway
    restart: unless-stopped
    stop_grace_period: 90s
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    # gateway.env must contain ADMIN_BROWSER_LOGIN=true, ADMIN_ORIGIN=https://kiro.rent,
    # and a single-quoted ADMIN_PASSWORD_HASH. Missing/invalid values fail startup.
    # The compatibility IP host serves the shell but cannot authenticate for this origin.
    env_file: [/etc/kiro-byok/gateway.env]
    # Caddy is the gateway's only peer; without these every customer shares one per-address
    # rate limit and lockout.
    environment:
      TRUSTED_PROXY_HEADERS: "true"
      TRUSTED_PROXY_CIDRS: 172.30.82.0/24
    volumes: [/opt/kiro-byok/data:/app/data]
    networks: [kiro-net]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
  caddy:
    image: caddy:2-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    container_name: kiro-caddy
    restart: unless-stopped
    init: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    ports: ["80:80", "443:443"]
    env_file: [/etc/kiro-byok/caddy.env]
    volumes:
      - ./Caddyfile.ip:/etc/caddy/Caddyfile:ro
      - ../apps/admin-ui/dist:/app/admin-ui:ro
      - ../apps/portal-ui:/app/portal-ui:ro
      - /opt/kiro-byok/downloads:/app/downloads:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [kiro-net]
    depends_on:
      gateway: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
networks:
  kiro-net:
    ipam:
      config: [{subnet: 172.30.82.0/24}]
volumes:
  caddy_data:
  caddy_config:
