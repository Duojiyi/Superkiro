<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕的海岸骑行</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #eeeadd; color: #264c4c; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; padding: 28px; }
  main { width: min(1100px, 100%); }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; gap: 20px; }
  .eyebrow { font-size: 11px; letter-spacing: 4px; font-weight: 700; }
  h1 { font-size: clamp(24px, 4vw, 40px); font-weight: 500; margin: 10px 0 0; letter-spacing: 3px; }
  .badge { border: 1px solid #9baea2; border-radius: 30px; padding: 10px 16px; font-size: 12px; white-space: nowrap; }
  .scene { border-radius: 22px; overflow: hidden; border: 1px solid #d2d7c6; background: #dcece3; }
  svg { display: block; width: 100%; height: auto; }
  footer { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-top: 20px; font-size: 12px; color: #657b72; }
  button { background: transparent; color: #264c4c; border: 1px solid #9baea2; border-radius: 24px; padding: 10px 19px; cursor: pointer; font: inherit; }
  button:hover { background: #dce5d8; }
  button:focus-visible { outline: 3px solid #c8803c; outline-offset: 4px; }
  .spin { animation: spin 1.3s linear infinite; }
  .rear { transform-origin: 375px 437px; }
  .front { transform-origin: 704px 437px; }
  .crank { transform-origin: 520px 435px; }
  .rider { animation: bounce .65s ease-in-out infinite alternate; }
  .scarf { transform-origin: 548px 223px; animation: flutter .65s ease-in-out infinite alternate; }
  .road { animation: drift 1.3s linear infinite; }
  .clouds { animation: drift 20s linear infinite; }
  .paused * { animation-play-state: paused !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bounce { to { transform: translateY(-4px) rotate(.3deg); } }
  @keyframes flutter { to { transform: rotate(7deg); } }
  @keyframes drift { to { transform: translateX(-220px); } }
  @media (prefers-reduced-motion: reduce) { .scene * { animation: none !important; } }
  @media (max-width: 560px) { body { padding: 16px; } .badge { display: none; } footer { align-items: flex-start; } }
</style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">THE SLOW COAST · 001</div><h1>顺着海风，慢慢骑。</h1></div><span class="badge">海岸骑行日记 / 晴</span></header>
  <div class="scene" id="scene">
    <svg viewBox="0 0 1100 620" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
      <title id="title">鹈鹕的海岸骑行</title>
      <desc id="desc">一只长着橙色大嘴、戴着绿色帽子和红色围巾的白色鹈鹕，踩着薄荷绿色自行车沿海岸前行。车轮旋转，双脚蹬踏，围巾随风飘动。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#deeee5"/><stop offset="1" stop-color="#f4efd8"/></linearGradient>
        <g id="spokes" stroke="#65847c" stroke-width="2" opacity=".7">
          <path d="M-77 0H77M0-77V77M-54-54L54 54M-54 54L54-54M-71-29L71 29M-29-71L29 71M-71 29L71-29M-29 71L29-71"/>
        </g>
        <g id="cloud" fill="#fffaf0"><path d="M0 22C-3 8 15 2 26 10C32-10 64-8 72 10C90 3 106 14 103 22Z"/></g>
        <g id="grass" stroke="#7d9977" stroke-width="3" stroke-linecap="round"><path d="M0 0l-5-17M0 0l9-24M0 0l17-11"/></g>
      </defs>
      <path fill="url(#sky)" d="M0 0h1100v620H0z"/>
      <circle cx="859" cy="122" r="54" fill="#f5cb79"/>
      <circle cx="859" cy="122" r="70" fill="none" stroke="#f5cb79" opacity=".25"/>
      <g class="clouds" opacity=".85"><use href="#cloud" x="170" y="99"/><use href="#cloud" x="508" y="57"/><use href="#cloud" x="1040" y="102"/><use href="#cloud" x="1280" y="70"/></g>
      <path d="M0 304Q120 242 231 287T450 292T678 290T925 275T1100 292V382H0Z" fill="#b8d2be"/>
      <path d="M0 325Q160 286 318 324T640 316T960 318T1100 312V416H0Z" fill="#97bdaf"/>
      <path d="M0 350Q240 340 495 355T1100 347V431H0Z" fill="#aed5cb"/>
      <g stroke="#e9f2df" stroke-width="3" stroke-linecap="round" opacity=".75"><path d="M37 373h111m29 18h74m506-14h113m42 23h131M490 378h64"/></g>
      <path d="M0 419Q290 393 561 415T1100 407V620H0Z" fill="#e5dabb"/>
      <path d="M0 478Q440 449 1100 473V565Q492 532 0 558Z" fill="#f4ebd5"/>
      <g class="road" stroke="#d4c7a6" stroke-width="3" stroke-linecap="round">
        <path d="M0 533h56m164 0h56m164 0h56m164 0h56m164 0h56m164 0h56m164 0h56"/>
      </g>
      <g fill="#b7be92"><ellipse cx="157" cy="460" rx="16" ry="4"/><ellipse cx="928" cy="450" rx="20" ry="4"/><ellipse cx="826" cy="578" rx="10" ry="3"/></g>
      <use href="#grass" x="133" y="447"/><use href="#grass" x="963" y="447"/><use href="#grass" x="225" y="585"/>
      <ellipse cx="540" cy="522" rx="254" ry="15" fill="#757a60" opacity=".13"/>
      <!-- Bicycle wheels and spinning spokes. -->
      <g fill="#edf0dc" fill-opacity=".35" stroke="#304e4c" stroke-width="11"><circle cx="375" cy="437" r="84"/><circle cx="704" cy="437" r="84"/></g>
      <g fill="none" stroke="#f9f4df" stroke-width="3"><circle cx="375" cy="437" r="77"/><circle cx="704" cy="437" r="77"/></g>
      <g class="spin rear"><use href="#spokes" x="375" y="437"/><path d="M375 357v9" stroke="#db9c58" stroke-width="5"/></g>
      <g class="spin front"><use href="#spokes" x="704" y="437"/><path d="M704 357v9" stroke="#db9c58" stroke-width="5"/></g>
      <!-- Far foot travels opposite the near foot. -->
      <g stroke="#be7d3f" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M497 322L476 376L492 435"><animate attributeName="d" dur="1.3s" repeatCount="indefinite" values="M497 322L476 376L492 435;M497 322L505 364L520 407;M497 322L528 372L548 435;M497 322L500 396L520 463;M497 322L476 376L492 435"/></path>
      </g>
      <g stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M375 437L461 327L520 435L375 437M461 327L663 326L520 435M663 326L704 437" stroke="#345b54" stroke-width="12"/>
        <path d="M375 437L461 327L520 435L375 437M461 327L663 326L520 435M663 326L704 437" stroke="#67a993" stroke-width="7"/>
        <path d="M461 327L450 301M663 326L650 284Q645 271 664 269H690" stroke="#365752" stroke-width="8"/>
        <path d="M688 269h20" stroke="#bd8258" stroke-width="11"/>
        <path d="M677 273Q730 303 697 357" stroke="#56726b" stroke-width="2"/>
        <path d="M422 304Q447 297 476 303" stroke="#714e3e" stroke-width="13"/>
        <path d="M375 437L520 450Q542 451 542 434Q542 418 522 419L375 427Z" stroke="#637b68" stroke-width="3"/>
      </g>
      <g fill="#345952"><circle cx="375" cy="437" r="8"/><circle cx="704" cy="437" r="8"/><circle cx="520" cy="435" r="20"/></g>
      <g class="spin crank" stroke="#e9e2c9" stroke-width="6"><path d="M492 435h56"/><g stroke="#35534c" stroke-width="7"><path d="M484 435h16M540 435h16"/></g></g>
      <!-- Pelican silhouette, pouch, folded wing, scarf, and cap. -->
      <g class="rider" stroke="#425b51" stroke-width="3" stroke-linejoin="round">
        <path d="M444 288L395 278L427 311Z" fill="#e5e6d7"/>
        <path d="M440 233Q474 219 510 238Q523 218 525 190L525 167Q526 130 555 130Q589 128 590 165Q586 187 565 194Q558 218 565 250Q568 294 524 316Q481 338 445 308Q413 282 440 233Z" fill="#fffbed"/>
        <path d="M440 270Q451 306 493 308Q525 306 540 289Q513 322 476 315Q447 309 440 270" fill="#e2e5d6" stroke="none"/>
        <path d="M453 254Q487 234 521 274Q489 296 453 254Z" fill="#e5e9dd"/>
        <path d="M465 258Q487 269 506 273" fill="none" stroke="#a0b2a1"/>
        <path d="M576 171L709 181Q683 221 620 223Q589 220 576 185Z" fill="#edb56a"/>
        <path d="M578 168Q638 165 721 183L577 183Z" fill="#e6a047"/>
        <path d="M598 190Q615 212 657 207" fill="none" stroke="#d59451" stroke-width="2"/>
        <circle cx="566" cy="157" r="5" fill="#294940" stroke="none"/><circle cx="567" cy="155.5" r="1.5" fill="white" stroke="none"/>
        <path d="M547 146Q554 141 560 144" fill="none" stroke-width="2"/>
        <path d="M524 137Q522 107 550 104Q576 104 579 135Z" fill="#65967d"/>
        <path d="M517 138Q550 130 591 137" fill="none" stroke="#345d50" stroke-width="7" stroke-linecap="round"/>
        <path d="M537 108L535 126" stroke="#89ac8e" fill="none"/>
        <g class="scarf" fill="#c7684f" stroke="#a95543" stroke-width="2"><path d="M548 223Q509 211 482 219L453 209L463 233Q508 245 548 232Z"/><path d="M539 226Q511 240 488 237L477 251Q511 257 548 231Z"/></g>
        <path d="M529 211Q543 220 562 217L565 231Q543 235 526 225Z" fill="#d67959" stroke="#a95543" stroke-width="2"/>
        <path d="M522 250Q542 236 568 253L622 282Q636 286 650 271" fill="none" stroke="#425b51" stroke-width="18" stroke-linecap="round"/>
        <path d="M522 250Q542 236 568 253L622 282Q636 286 650 271" fill="none" stroke="#f7f5e7" stroke-width="12" stroke-linecap="round"/>
      </g>
      <path d="M511 315L546 369L548 435" fill="none" stroke="#dc9a4c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="d" dur="1.3s" repeatCount="indefinite" values="M511 315L546 369L548 435;M511 315L541 391L520 463;M511 315L498 382L492 435;M511 315L517 359L520 407;M511 315L546 369L548 435"/></path>
      <path d="M539 433Q550 429 567 437L540 440Z" fill="#e4a153" stroke="#ae733b" stroke-width="2"><animateTransform attributeName="transform" type="translate" dur="1.3s" repeatCount="indefinite" values="0 0;-28 28;-56 0;-28 -28;0 0"/></path>
      <g stroke="#78988a" stroke-width="3" stroke-linecap="round" opacity=".65"><path d="M344 245h49M327 261h39M361 224h34"/></g>
      <text x="52" y="574" font-family="sans-serif" font-size="11" letter-spacing="3" fill="#879178">NO HURRY. JUST A LITTLE SEA BREEZE.</text>
    </svg>
  </div>
  <footer><span>今日路线：沿着海岸线，一直骑到日落。</span><button id="toggle" type="button" aria-pressed="false">暂停动画</button></footer>
</main>
<script>
  const scene = document.getElementById('scene');
  const svg = scene.querySelector('svg');
  const button = document.getElementById('toggle');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  function pause(paused) {
    scene.classList.toggle('paused', paused);
    paused ? svg.pauseAnimations() : svg.unpauseAnimations();
    button.textContent = paused ? '继续动画' : '暂停动画';
    button.setAttribute('aria-pressed', String(paused));
  }
  button.addEventListener('click', () => pause(!scene.classList.contains('paused')));
  reducedMotion.addEventListener('change', event => pause(event.matches));
  pause(reducedMotion.matches);
</script>
</body>
</html>
