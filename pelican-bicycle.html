<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鹈鹕骑自行车</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #1d2a3a 0%, #121820 60%, #0d1116 100%);
    color: #cfd8e3;
  }
  h1 {
    margin: 0;
    font-size: clamp(16px, 3.4vw, 22px);
    font-weight: 600;
    letter-spacing: .06em;
    color: #eaf2fb;
  }
  .stage {
    width: 100%;
    max-width: 900px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .06);
    background: #cdeeff;
  }
  svg { display: block; width: 100%; height: auto; }
  p.note { margin: 0; font-size: 12px; opacity: .6; text-align: center; max-width: 640px; }

  /* 速度线的淡入淡出（只动 opacity，不与 SMIL 的 transform 冲突） */
  .zip { animation: zipFade .42s linear infinite; }
  .zip:nth-of-type(2) { animation-delay: -.14s; }
  .zip:nth-of-type(3) { animation-delay: -.28s; }
  @keyframes zipFade { 0% { opacity: 0 } 25% { opacity: .75 } 100% { opacity: 0 } }
</style>
</head>
<body>

<h1>🚲 骑自行车的鹈鹕</h1>

<div class="stage">
<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只戴围巾的鹈鹕骑着红色自行车向前飞驰的二维动画">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#7cc9f0"/>
      <stop offset=".52"  stop-color="#c6ecff"/>
      <stop offset="1"    stop-color="#f6fcff"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0"   stop-color="#fff3c4" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ffe08a" stop-opacity=".35"/>
      <stop offset="1"   stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2cda4"/>
      <stop offset="1" stop-color="#b79c71"/>
    </linearGradient>
    <linearGradient id="bodyG" x1=".2" y1="0" x2=".7" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#f4f6fa"/>
      <stop offset="1"   stop-color="#dbe2ec"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#ffd07a"/>
      <stop offset="1" stop-color="#f0922c"/>
    </linearGradient>
    <linearGradient id="pouchG" x1=".2" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#ffcb7d"/>
      <stop offset="1" stop-color="#ef8f2b"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4674f"/>
      <stop offset="1" stop-color="#cf3b2c"/>
    </linearGradient>
    <radialGradient id="shadowG" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4a3a22" stop-opacity=".42"/>
      <stop offset="1" stop-color="#4a3a22" stop-opacity="0"/>
    </radialGradient>

    <!-- 一朵云 -->
    <g id="cloud" fill="#ffffff">
      <ellipse cx="0"   cy="0"   rx="36" ry="21"/>
      <ellipse cx="30"  cy="7"   rx="27" ry="15"/>
      <ellipse cx="-31" cy="8"   rx="25" ry="14"/>
      <ellipse cx="4"   cy="-15" rx="24" ry="17"/>
    </g>

    <!-- 一丛草 -->
    <g id="tuft" fill="#4f9d74">
      <path d="M0 0 C -3 -9, -6 -13, -10 -16 C -5 -15, -2 -10, 0 -5
               C 1 -12, 3 -17, 6 -21 C 6 -14, 4 -7, 3 -2
               C 6 -7, 9 -10, 13 -12 C 10 -7, 6 -3, 4 0 Z"/>
    </g>

    <!-- 灌木 -->
    <g id="bush" fill="#4fa87c">
      <ellipse cx="0"   cy="0"  rx="22" ry="15"/>
      <ellipse cx="17"  cy="4"  rx="15" ry="11"/>
      <ellipse cx="-16" cy="4"  rx="14" ry="10"/>
      <ellipse cx="2"   cy="-9" rx="14" ry="11"/>
    </g>

    <!-- 车轮（原点即轮心） -->
    <g id="wheel">
      <circle r="60" fill="none" stroke="#2c3238" stroke-width="10"/>
      <circle r="60" fill="none" stroke="#4a545e" stroke-width="2" stroke-dasharray="7 7"/>
      <circle r="52" fill="none" stroke="#e3e9f0" stroke-width="4"/>
      <path d="M-52 0H52 M-42.1 -30.6L42.1 30.6 M-16.1 -49.5L16.1 49.5
               M16.1 -49.5L-16.1 49.5 M42.1 -30.6L-42.1 30.6"
            stroke="#c9d3dd" stroke-width="2.2" fill="none"/>
      <circle r="7" fill="#aeb9c4"/>
      <circle r="3" fill="#78848f"/>
      <rect x="-5" y="-45" width="10" height="7" rx="2.5" fill="#ffd93b" stroke="#c9a10f" stroke-width="1"/>
    </g>
  </defs>

  <!-- ============ 天空 ============ -->
  <rect width="800" height="470" fill="url(#sky)"/>
  <circle cx="662" cy="74" r="94" fill="url(#sunGlow)"/>
  <circle cx="662" cy="74" r="34" fill="#ffe27a"/>

  <!-- 云：最慢的一层视差 -->
  <g opacity=".95">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; -800 0" dur="26s" repeatCount="indefinite"/>
    <use href="#cloud" x="90"   y="72"/>
    <use href="#cloud" x="380"  y="44"  opacity=".85"/>
    <use href="#cloud" x="640"  y="118" opacity=".7"/>
    <use href="#cloud" x="890"  y="72"/>
    <use href="#cloud" x="1180" y="44"  opacity=".85"/>
    <use href="#cloud" x="1440" y="118" opacity=".7"/>
  </g>

  <!-- ============ 远山 ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; -800 0" dur="11s" repeatCount="indefinite"/>
    <g fill="#a3dcc4">
      <path d="M0 300 C 60 260, 120 258, 180 298 C 240 330, 280 300, 340 262
               C 400 226, 460 268, 520 300 C 580 330, 640 296, 700 272
               C 740 256, 770 278, 800 300 L800 430 L0 430 Z"/>
      <path transform="translate(800,0)"
            d="M0 300 C 60 260, 120 258, 180 298 C 240 330, 280 300, 340 262
               C 400 226, 460 268, 520 300 C 580 330, 640 296, 700 272
               C 740 256, 770 278, 800 300 L800 430 L0 430 Z"/>
    </g>
  </g>

  <!-- ============ 近山 + 灌木 ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; -800 0" dur="5.2s" repeatCount="indefinite"/>
    <g fill="#63b78f">
      <path d="M0 344 C 70 318, 130 358, 200 348 C 270 338, 310 304, 380 320
               C 450 336, 500 362, 570 350 C 640 338, 700 312, 760 330
               C 780 336, 792 341, 800 344 L800 430 L0 430 Z"/>
      <path transform="translate(800,0)"
            d="M0 344 C 70 318, 130 358, 200 348 C 270 338, 310 304, 380 320
               C 450 336, 500 362, 570 350 C 640 338, 700 312, 760 330
               C 780 336, 792 341, 800 344 L800 430 L0 430 Z"/>
    </g>
    <use href="#bush" x="120"  y="352"/>
    <use href="#bush" x="392"  y="330"/>
    <use href="#bush" x="672"  y="336"/>
    <use href="#bush" x="920"  y="352"/>
    <use href="#bush" x="1192" y="330"/>
    <use href="#bush" x="1472" y="336"/>
  </g>

  <!-- ============ 地面 / 马路 ============ -->
  <rect x="0" y="382" width="800" height="12" fill="#57a97e"/>
  <rect x="0" y="390" width="800" height="80" fill="url(#road)"/>
  <rect x="0" y="390" width="800" height="3" fill="#8f7a55" opacity=".5"/>

  <!-- 路边草穗：最快的一层 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; -200 0" dur=".48s" repeatCount="indefinite"/>
    <use href="#tuft" x="20"  y="390"/><use href="#tuft" x="96"  y="389"/>
    <use href="#tuft" x="158" y="391"/><use href="#tuft" x="220" y="390"/>
    <use href="#tuft" x="296" y="389"/><use href="#tuft" x="358" y="391"/>
    <use href="#tuft" x="420" y="390"/><use href="#tuft" x="496" y="389"/>
    <use href="#tuft" x="558" y="391"/><use href="#tuft" x="620" y="390"/>
    <use href="#tuft" x="696" y="389"/><use href="#tuft" x="758" y="391"/>
    <use href="#tuft" x="820" y="390"/><use href="#tuft" x="896" y="389"/>
    <use href="#tuft" x="958" y="391"/>
  </g>

  <!-- 路面虚线与碎石 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; -160 0" dur=".38s" repeatCount="indefinite"/>
    <g fill="#fff8e6" opacity=".85">
      <rect x="0"   y="428" width="70" height="7" rx="3.5"/>
      <rect x="160" y="428" width="70" height="7" rx="3.5"/>
      <rect x="320" y="428" width="70" height="7" rx="3.5"/>
      <rect x="480" y="428" width="70" height="7" rx="3.5"/>
      <rect x="640" y="428" width="70" height="7" rx="3.5"/>
      <rect x="800" y="428" width="70" height="7" rx="3.5"/>
      <rect x="960" y="428" width="70" height="7" rx="3.5"/>
    </g>
    <g fill="#9c8760" opacity=".45">
      <circle cx="44"  cy="408" r="2.6"/><circle cx="118" cy="452" r="3.2"/>
      <circle cx="198" cy="400" r="2.2"/><circle cx="268" cy="458" r="2.6"/>
      <circle cx="344" cy="414" r="3"/>  <circle cx="430" cy="446" r="2.4"/>
      <circle cx="508" cy="402" r="2.8"/><circle cx="596" cy="456" r="3"/>
      <circle cx="684" cy="410" r="2.4"/><circle cx="756" cy="448" r="2.8"/>
      <circle cx="844" cy="408" r="2.6"/><circle cx="918" cy="452" r="3.2"/>
      <circle cx="998" cy="400" r="2.2"/>
    </g>
  </g>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="4" opacity=".7">
    <line class="zip" x1="40" y1="214" x2="150" y2="214"/>
    <line class="zip" x1="16" y1="262" x2="112" y2="262"/>
    <line class="zip" x1="58" y1="312" x2="146" y2="312"/>
  </g>

  <!-- 地面投影 -->
  <ellipse cx="392" cy="396" rx="185" ry="16" fill="url(#shadowG)">
    <animate attributeName="rx"      values="185;172;185" dur=".675s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.82;1"     dur=".675s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ============ 自行车 + 鹈鹕（整体颠簸） ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -4.5; 0 0" dur=".675s" repeatCount="indefinite"/>

    <!-- ---- 远侧曲柄 + 脚踏（相位差 180°）---- -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="180 400 336" to="540 400 336" dur="1.35s" repeatCount="indefinite"/>
      <g transform="translate(400,336)">
        <line x1="0" y1="0" x2="26" y2="0" stroke="#8d97a1" stroke-width="7" stroke-linecap="round"/>
        <g transform="translate(26,0)">
          <animateTransform attributeName="transform" type="rotate" additive="sum"
                            from="-180" to="-540" dur="1.35s" repeatCount="indefinite"/>
          <rect x="-13" y="0" width="26" height="6" rx="2" fill="#6f7983"/>
        </g>
      </g>
    </g>

    <!-- ---- 远侧腿（两段 IK，踝关节锁在脚踏上）---- -->
    <g transform="translate(385,262)" opacity=".82">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="50.0;29.8;4.8;2.4;21.4;46.7;63.0;60.9;50.0"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          calcMode="spline"
          keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"
          dur="1.35s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="50" y2="0" stroke="#cfd6e0" stroke-width="22" stroke-linecap="round"/>
        <g transform="translate(50,0)">
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="90.4;116.9;123.7;104.8;74.3;44.2;34.9;58.7;90.4"
              keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
              calcMode="spline"
              keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"
              dur="1.35s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="56" y2="0" stroke="#dba24a" stroke-width="11" stroke-linecap="round"/>
            <g transform="translate(56,0)">
              <g>
                <animateTransform attributeName="transform" type="rotate"
                  values="-140.4;-146.7;-128.5;-107.2;-95.7;-90.9;-97.9;-119.6;-140.4"
                  keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                  calcMode="spline"
                  keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"
                  dur="1.35s" repeatCount="indefinite"/>
                <path d="M-14 -2 C -16 -10, -2 -14, 8 -11 L 22 -8 C 30 -6, 30 3, 22 3
                         L -8 3 C -13 3, -15 1, -14 -2 Z" fill="#dba24a"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- ---- 后轮 ---- -->
    <g transform="translate(268,328)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur=".9s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>

    <!-- ---- 前轮 ---- -->
    <g transform="translate(516,328)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur=".9s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>

    <!-- ---- 链条 ---- -->
    <g stroke="#79848f" stroke-width="4.5" fill="none" stroke-linecap="round">
      <path d="M400 317 L268 319"/>
      <path d="M400 355 L268 337"/>
    </g>
    <g stroke="#cfd8e1" stroke-width="2.4" fill="none" stroke-dasharray="4 4">
      <path d="M400 317 L268 319">
        <animate attributeName="stroke-dashoffset" from="0" to="-16" dur=".18s" repeatCount="indefinite"/>
      </path>
      <path d="M400 355 L268 337">
        <animate attributeName="stroke-dashoffset" from="0" to="-16" dur=".18s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- ---- 车架 ---- -->
    <g fill="none" stroke="url(#frameG)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M400 336 L268 328"/>           <!-- 后下叉 -->
      <path d="M372 256 L268 328"/>           <!-- 后上叉 -->
      <path d="M400 336 L370 250"/>           <!-- 座管 -->
      <path d="M400 336 L486 286"/>           <!-- 下管 -->
      <path d="M374 254 L479 252"/>           <!-- 上管 -->
      <path d="M478 246 L489 292"/>           <!-- 头管 -->
      <path d="M489 288 Q 500 308, 516 328"/> <!-- 前叉 -->
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="2" opacity=".28" stroke-linecap="round">
      <path d="M402 331 L488 282"/>
      <path d="M376 249 L477 247"/>
    </g>

    <!-- 后飞轮 -->
    <circle cx="268" cy="328" r="10"   fill="none" stroke="#b9c3cd" stroke-width="3.5"/>
    <circle cx="268" cy="328" r="12.5" fill="none" stroke="#98a3ae" stroke-width="2" stroke-dasharray="2 3"/>

    <!-- 座垫 -->
    <path d="M340 250 C 344 240, 366 236, 382 239 C 394 241, 395 251, 385 254
             C 368 259, 346 258, 340 250 Z" fill="#4a3b33"/>
    <path d="M344 247 C 350 241, 366 239, 379 241 C 386 243, 386 247, 379 249
             C 364 252, 350 252, 344 247 Z" fill="#614d42"/>

    <!-- ---- 牙盘 ---- -->
    <g transform="translate(400,336)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="1.35s" repeatCount="indefinite"/>
        <circle r="19"   fill="#eef2f6" stroke="#aab4be" stroke-width="3"/>
        <circle r="21.5" fill="none" stroke="#9aa5b0" stroke-width="4" stroke-dasharray="3 5.2"/>
        <path d="M-15 0H15 M-7.5 -13L7.5 13 M7.5 -13L-7.5 13" stroke="#c2ccd6" stroke-width="3.5"/>
        <circle r="5" fill="#8d97a1"/>
      </g>
    </g>

    <!-- ---- 近侧曲柄 + 脚踏 ---- -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 400 336" to="360 400 336" dur="1.35s" repeatCount="indefinite"/>
      <g transform="translate(400,336)">
        <line x1="0" y1="0" x2="26" y2="0" stroke="#c2ccd6" stroke-width="7.5" stroke-linecap="round"/>
        <g transform="translate(26,0)">
          <animateTransform attributeName="transform" type="rotate" additive="sum"
                            from="0" to="-360" dur="1.35s" repeatCount="indefinite"/>
          <rect x="-14" y="0"   width="28" height="7"   rx="2.5" fill="#3f474f"/>
          <rect x="-14" y="0.5" width="28" height="2.4" rx="1.2" fill="#6e7a86"/>
        </g>
      </g>
    </g>

    <!-- ---- 近侧腿 ---- -->
    <g transform="translate(385,262)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="21.4;46.7;63.0;60.9;50.0;29.8;4.8;2.4;21.4"
          keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
          calcMode="spline"
          keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"
          dur="1.35s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="50" y2="0" stroke="#f1f4f9" stroke-width="24" stroke-linecap="round"/>
        <line x1="6" y1="0" x2="48" y2="0" stroke="#dde3ec" stroke-width="10" stroke-linecap="round" opacity=".7"/>
        <g transform="translate(50,0)">
          <g>
            <animateTransform attributeName="transform" type="rotate"
              values="74.3;44.2;34.9;58.7;90.4;116.9;123.7;104.8;74.3"
              keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
              calcMode="spline"
              keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"
              dur="1.35s" repeatCount="indefinite"/>
            <line x1="0" y1="0" x2="56" y2="0" stroke="#f5a93f" stroke-width="12" stroke-linecap="round"/>
            <line x1="8" y1="-2" x2="50" y2="-2" stroke="#ffc775" stroke-width="3"
                  stroke-linecap="round" opacity=".75"/>
            <g transform="translate(56,0)">
              <g>
                <animateTransform attributeName="transform" type="rotate"
                  values="-95.7;-90.9;-97.9;-119.6;-140.4;-146.7;-128.5;-107.2;-95.7"
                  keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                  calcMode="spline"
                  keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1"
                  dur="1.35s" repeatCount="indefinite"/>
                <path d="M-14 -2 C -16 -10, -2 -14, 8 -11 L 22 -8 C 30 -6, 30 3, 22 3
                         L -8 3 C -13 3, -15 1, -14 -2 Z"
                      fill="#f5a93f" stroke="#d9861f" stroke-width="1.4" stroke-linejoin="round"/>
                <path d="M6 -10 L 9 2 M14 -8.6 L 16 2" stroke="#d9861f" stroke-width="1.2" fill="none"/>
              </g>
            </g>
          </g>
        </g>
      </g>
    </g>

    <!-- ============ 鹈鹕 ============ -->

    <!-- 尾羽 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 330 236; 5 330 236; 0 330 236; -4 330 236; 0 330 236"
                        dur="1.35s" repeatCount="indefinite"/>
      <path d="M334 216 C 312 208, 292 202, 272 205 C 285 215, 294 223, 299 231
               C 286 233, 277 239, 272 246 C 294 251, 318 252, 336 246 Z"
            fill="#e7ecf3" stroke="#c6cfdb" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M330 220 C 313 216, 298 213, 285 212 M328 232 C 312 231, 300 234, 288 239"
            fill="none" stroke="#c6cfdb" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- 身体 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-1.6 378 240; 1.4 378 240; -1.6 378 240"
                        dur=".675s" repeatCount="indefinite"/>
      <path d="M328 214 C 336 184, 394 180, 418 206 C 438 226, 436 252, 414 264
               C 396 276, 348 278, 334 262 C 320 246, 320 228, 328 214 Z"
