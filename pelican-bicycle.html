<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3e9">
  <title>海风骑行 · Pelican Cycling Club</title>
  <style>
    :root { color-scheme: light; --ink: #29483e; --paper: #f6f3e9; --muted: #778478; --pedal: 1.6s; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 1240px; margin: auto; padding: 32px 40px 24px; }
    .masthead, .brand, .intro, .footer, .motion-control { display: flex; align-items: center; }
    .masthead { justify-content: space-between; padding-bottom: 24px; border-bottom: 1px solid #29483e26; }
    .brand { gap: 12px; }
    .brand-mark { width: 42px; height: 42px; }
    .brand-name { font-size: 12px; line-height: 1.55; font-weight: 750; letter-spacing: 2.5px; }
    .edition { font: 11px/1.5 "Courier New", monospace; letter-spacing: 1.5px; color: var(--muted); }
    .intro { justify-content: space-between; gap: 24px; padding: 32px 0 28px; }
    .eyebrow { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 11px; letter-spacing: 3px; }
    .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #d98160; }
    h1 { margin: 0; font-family: "Songti SC", "Noto Serif CJK SC", SimSun, Georgia, serif; font-size: clamp(27px, 3.5vw, 46px); font-weight: 500; letter-spacing: 2px; }
    .intro-note { margin: 23px 0 0; text-align: right; font-size: 12px; line-height: 1.9; color: var(--muted); }
    .intro-note em { font-family: Georgia, serif; font-size: 19px; font-weight: 400; color: #526d5c; }
    .stage { position: relative; overflow: hidden; isolation: isolate; border: 1px solid #29483e1a; border-radius: 18px; background: #eaf0e4; }
    .scene { display: block; width: 100%; height: auto; }
    .scene text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    .motion-toggle { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .motion-control { position: absolute; right: 22px; bottom: 20px; gap: 9px; min-height: 40px; padding: 10px 15px; border: 1px solid #29483e28; border-radius: 30px; background: #fcfaf0e8; font-size: 11px; letter-spacing: 1px; cursor: pointer; user-select: none; transition: background .2s; }
    .motion-control:hover { background: #fffdf5; }
    .motion-toggle:focus-visible ~ .motion-control { outline: 3px solid #bc704d; outline-offset: 4px; }
    .pause-icon { width: 9px; height: 11px; border-left: 3px solid currentColor; border-right: 3px solid currentColor; }
    .play-icon, .play-label { display: none; }
    .motion-toggle:checked ~ .scene .animated { animation-play-state: paused; }
    .motion-toggle:checked ~ .motion-control .pause-icon, .motion-toggle:checked ~ .motion-control .pause-label { display: none; }
    .motion-toggle:checked ~ .motion-control .play-label { display: inline; }
    .motion-toggle:checked ~ .motion-control .play-icon { display: inline-block; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 9px solid currentColor; }
    .footer { justify-content: space-between; gap: 18px; padding: 20px 2px 0; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
    .footer strong { color: #526959; font-weight: 500; }
    .footer .motto { font-family: Georgia, serif; font-style: italic; font-size: 15px; letter-spacing: .2px; }
    .spin { animation: turn var(--pedal) linear infinite; transform-origin: 0 0; }
    .counter-spin { animation: counter-turn var(--pedal) linear infinite; transform-origin: 0 0; }
    .bicycle { animation: bob .8s ease-in-out infinite; }
    .scarf { transform-origin: 609px 246px; animation: flutter .8s ease-in-out infinite alternate; }
    .wing { transform-origin: 564px 288px; animation: wing-bob .8s ease-in-out infinite alternate; }
    .clouds { animation: drift 70s linear infinite; }
    .sea-lines { animation: drift 36s linear infinite; }
    .road { animation: drift 5.5s linear infinite; }
    .plants { animation: drift 11s linear infinite; }
    .gull { animation: soar 5s ease-in-out infinite alternate; }
    .gull.second { animation-delay: -2s; }
    .breeze { animation: breeze 2.5s ease-in-out infinite; }
    .near-leg { animation: pedal-near var(--pedal) linear infinite; }
    .far-leg { animation: pedal-far var(--pedal) linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes counter-turn { to { transform: rotate(-360deg); } }
    @keyframes bob { 50% { transform: translateY(-2px); } }
    @keyframes flutter { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    @keyframes wing-bob { to { transform: rotate(1deg); } }
    @keyframes drift { to { transform: translateX(-1200px); } }
    @keyframes soar { to { transform: translate(-24px, -12px); } }
    @keyframes breeze { 0%, 100% { opacity: .15; transform: translateX(12px); } 50% { opacity: .65; transform: translateX(-12px); } }
    @keyframes pedal-near {
      0%, 100% { d: path("M 584 355 Q 624 371 644 418 L 636 493"); }
      25% { d: path("M 584 355 Q 624 384 637 431 L 610 519"); }
      50% { d: path("M 584 355 Q 614 372 615 410 L 584 493"); }
      75% { d: path("M 584 355 Q 618 362 624 394 L 610 467"); }
    }
    @keyframes pedal-far {
      0%, 100% { d: path("M 566 352 Q 596 370 599 411 L 584 493"); }
      25% { d: path("M 566 352 Q 608 361 608 393 L 610 467"); }
      50% { d: path("M 566 352 Q 620 374 629 418 L 636 493"); }
      75% { d: path("M 566 352 Q 611 383 621 432 L 610 519"); }
    }
    @media (max-width: 680px) {
      main { padding: 22px 18px; }
      .masthead { padding-bottom: 18px; }
      .brand-name { font-size: 10px; letter-spacing: 1.8px; }
      .edition { font-size: 9px; letter-spacing: .5px; }
      .intro { display: block; padding: 27px 0 22px; }
      .intro-note { margin-top: 15px; text-align: left; }
      .intro-note br { display: none; }
      .intro-note em { font-size: 16px; margin-right: 8px; }
      .stage { border-radius: 12px; }
      .scene { width: 155%; max-width: none; margin-left: -31%; }
      .motion-control { right: 12px; bottom: 12px; padding: 9px 12px; }
      .footer { align-items: flex-start; font-size: 10px; line-height: 1.8; }
      .footer .motto { max-width: 130px; text-align: right; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .animated { animation: none !important; }
      .motion-control { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 44 44" fill="none" aria-hidden="true">
          <circle cx="22" cy="22" r="20" stroke="currentColor" stroke-width="1.3"/>
          <path d="M10 28C15 29 19 26 19 20V15C19 11 25 10 27 14L35 18H26C27 27 24 31 18 32Z" fill="currentColor"/>
          <path d="M26 18H35L29 22Z" fill="#d9a650"/>
          <circle cx="24" cy="14.5" r="1" fill="#f6f3e9"/>
        </svg>
        <div class="brand-name">PELICAN<br>CYCLING CLUB</div>
      </div>
      <span class="edition">FIELD NOTES / NO. 028</span>

    <section aria-labelledby="page-title">
      <div class="intro">
        <div>
          <p class="eyebrow">海岸漫游 · 今日宜慢行</p>

            <pattern id="paper-grain" width="37" height="37" patternUnits="userSpaceOnUse">

            </g>

          </g>
          <text x="153" y="401" fill="#64765e" font-size="11" font-weight="600" letter-spacing="1.2">TO THE SEA</text>
          <g transform="translate(51 47)" fill="#6c8271">
            <circle cx="5" cy="5" r="4" fill="#d08a62"/>
            <text x="20" y="9" font-size="10" letter-spacing="2.4">THE COASTAL ROUTE</text>

            <path d="M450 484L610 475A19 19 0 0 1 610 512L450 503A10 10 0 0 1 450 484Z" fill="none" stroke="#89947a" stroke-width="2.5"/>

            <!-- Classic step-over frame, fork, saddle and swept handlebars. -->

            <path d="M578 384L710 375" fill="none" stroke="#9abca1" stroke-width="2"/>

            <path d="M531 350Q548 346 564 349L589 355Q595 359 586 365H537Q522 363 531 350Z" fill="#805943" stroke-width="3"/>
            <path d="M533 352L575 355" stroke="#bb9271" stroke-width="2"/>
            <circle cx="729" cy="307" r="7" fill="#e4bd6d" stroke-width="2"/>
            <circle cx="610" cy="493" r="22" fill="#e9dfb9" stroke-width="3"/>
            <circle cx="610" cy="493" r="15" fill="#548774" stroke-width="2"/>
            <path d="M648 411l16-5 13 32-16 6Z" fill="#f4edcf" stroke-width="2"/>
            <path d="M653 420l17-6" stroke="#cf805e" stroke-width="5"/>

            <path class="near-leg animated" d="M584 355Q624 371 644 418L636 493" fill="none" stroke="#886b40" stroke-width="13"/>
            <path class="near-leg animated" d="M584 355Q624 371 644 418L636 493" fill="none" stroke="#eab758" stroke-width="8"/>
            <g transform="translate(610 493)">
              <g class="spin animated">
                <path d="M-26 0H26" stroke="#304b40" stroke-width="5"/>

              <circle r="5" fill="#d6c89d" stroke-width="2"/>

          <g fill="#807e62" font-size="10" letter-spacing="1.8">
            <text x="38" y="613">SALTY AIR. HAPPY LEGS.</text>
          </g>
        </svg>
        <label class="motion-control" for="pause-ride" title="暂停或继续动画">
          <span class="pause-icon" aria-hidden="true"></span><span class="play-icon" aria-hidden="true"></span>

      </div>
    </section>
    <footer class="footer">
      <span><strong>一只鹈鹕，一辆单车。</strong> 一段刚刚好的旅程。</span>
      <span class="motto">Life is better at a slower pace.</span>
    </footer>
  </main>
</body>
</html>
